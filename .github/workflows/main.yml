name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.4"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev vlc

          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib run lime setup

      - name: Build Linux
        run: |
          if [ -f "Project.xml" ]; then
            lime build linux
          fi

  buildWindows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib run lime setup

      - name: Build Windows
        shell: bash
        run: |
          if [ -f "Project.xml" ]; then
            lime build windows
          fi

  buildMac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.4"

      - name: Install dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib run lime setup

      - name: Build macOS
        run: |
          if [ -f "Project.xml" ]; then
            lime build mac
          fi

  buildHTML5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.4"

      - name: Install dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib run lime setup

      - name: Build HTML5
        run: |
          if [ -f "Project.xml" ]; then
            lime build html5
          fi

  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.4"

      - name: Install dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxcpp --quiet

          haxelib run lime setup android

      - name: Build Android
        run: |
          if [ -f "Project.xml" ]; then
            lime build android
          fi

  buildiOS:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.4"

      - name: Install dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxcpp --quiet

          haxelib run lime setup ios

      - name: Build iOS
        run: |
          if [ -f "Project.xml" ]; then
            lime build ios
          fi
