name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.haxelib
          key: ${{ runner.os }}-haxelib

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Setup haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install libs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxcpp --quiet

          haxelib run lime setup

      - name: Build
        run: lime build linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: export/release/linux/**

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\haxelib
          key: windows-haxelib

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Setup haxelib
        shell: bash
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install libs
        shell: bash
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxcpp --quiet

          haxelib run lime setup

      - name: Build
        shell: bash
        run: haxelib run lime build windows

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: export/release/windows/**

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Setup haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install libs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxcpp --quiet

          haxelib run lime setup

      - name: Build
        run: lime build mac

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: export/release/macos/**

  build-html5:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Setup haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install libs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet

          haxelib run lime setup

      - name: Build
        run: lime build html5

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML5
          path: export/release/html5/**

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Setup haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install libs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxcpp --quiet

          haxelib run lime setup android

      - name: Build
        run: lime build android

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: export/release/android/bin/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-html5
      - build-android

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Linux/**
            Windows/**
            macOS/**
            HTML5/**
            Android/**
